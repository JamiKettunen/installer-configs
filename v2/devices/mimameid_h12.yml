              partitions:
                - partition: "boot"
                  file: "unpacked/boot.img"
                  group: "firmware"
                - partition: "dtbo"
                  file: "unpacked/dtbo.img"
                  group: "firmware"
                - partition: "gz"
                  file: "unpacked/gz.img"
                  group: "firmware"
                - partition: "lk"
                  file: "unpacked/lk.img"
                  group: "firmware"
                - partition: "logo"
                  file: "unpacked/logo.bin"
                  group: "firmware"
                - partition: "md1img"
                  file: "unpacked/md1img.img"
                  group: "firmware"
                - partition: "preloader"
                  file: "unpacked/preloader.img"
                  group: "firmware"
                - partition: "scp"
                  file: "unpacked/scp.img"
                  group: "firmware"
                - partition: "spmfw"
                  file: "unpacked/spmfw.img"
                  group: "firmware"
                - partition: "sspm"
                  file: "unpacked/sspm.img"
                  group: "firmware"
                - partition: "super"
                  file: "unpacked/super.img"
                  group: "firmware"
                - partition: "tee"
                  file: "unpacked/tee.img"
                  group: "firmware"
                - partition: "vbmeta"
