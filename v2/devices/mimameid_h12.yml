          - core:user_action:
              action: "bootloader"
      - actions:
          - fastboot:set_active:
              slot: "a"
          - fastboot:flash:
              partitions:
                - partition: "dtbo_a"
                  file: "unpacked/dtbo.img"
                  group: "firmware"
                - partition: "gz_a"
                  file: "unpacked/gz.img"
                  group: "firmware"
                - partition: "lk_a"
                  file: "unpacked/lk.img"
                  group: "firmware"
                - partition: "logo"
                  file: "unpacked/logo.img"
                  group: "firmware"
                - partition: "md1img_a"
                  file: "unpacked/md1img.img"
                  group: "firmware"
                - partition: "preloader_a"
                  file: "unpacked/preloader.img"
                  group: "firmware"
                - partition: "scp_a"
                  file: "unpacked/scp.img"
                  group: "firmware"
                - partition: "spmfw_a"
