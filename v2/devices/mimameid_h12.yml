name: "Volla Phone 22 with new display"
codename: "mimameid_h12"
formfactor: "phone"
# TODO: add "mimameid" to aliases once ready to migrate all users
aliases: []
user_actions:
  recovery:
    title: "Reboot to Recovery"
    description: 'With the device powered off, hold Volume Up + Power. When prompted choose a boot mode using Volume Up/Down to select "recovery" and confirm with Power button.'
    image: "phone_power_up"
    button: true
  bootloader:
    title: "Reboot to Bootloader"
    description: 'With the device powered off, hold Volume Up + Power. When prompted choose a boot mode using Volume Up/Down to select "fastboot" and confirm with Power button.'
    image: "phone_power_up"
    button: true
  sfos_notice:
    title: "SailfishOS: Notice"
    description: "Initial boot after installation when coming from non-SailfishOS will wipe userdata for use as /home. For additional information about the Volla device ports including known issues please visit the following URL."
    link: "https://forum.sailfishos.org/t/the-single-volla-thread/22553"
    button: true
  droidian_notice:
    title: "Droidian: Notice"
    description: "Installation will reflash userdata with the fresh Droidian rootfs. For additional information about the port including known issues, default passcode and recommended apps please visit the following URL."
    link: "https://devices.droidian.org/#/devices/mimameid"
    button: true
unlock: []
handlers:
  bootloader_locked:
    actions:
      - fastboot:flashing_unlock:
operating_systems:
  - name: "Ubuntu Touch"
    compatible_installer: ">=0.9.2-beta"
    options:
      - var: "channel"
        name: "Channel"
        tooltip: "The release channel"
        link: "https://docs.ubports.com/en/latest/about/process/release-schedule.html"
        type: "select"
        remote_values:
          systemimage:channels:
      - var: "wipe"
        name: "Wipe Userdata"
        tooltip: "Wipe personal data. *Required* if switching from something that isn't Ubuntu Touch."
        type: "checkbox"
      - var: "bootstrap"
        name: "Bootstrap"
        tooltip: "Flash system partitions using fastboot. Do NOT uncheck unless you know exactly what you're doing!"
        type: "checkbox"
        value: true
    prerequisites: []
    steps:
      # Firmware setup (bootstrap)
      - actions:
          - core:download:
              group: "firmware"
              files:
                - url: "https://volla.tech/filedump/volla-mimameid-12.0-ubports-installer-bootstrap.zip"
                  checksum:
                    sum: "bfcac4a2722bb01eb911d1daf9c9b50c246f5cb8e85cfa1aaaed5701d20bcc2c"
                    algorithm: "sha256"
          - core:unpack:
              group: "firmware"
              files:
                - archive: "volla-mimameid-12.0-ubports-installer-bootstrap.zip"
                  dir: "unpacked"
        condition:
          var: "bootstrap"
          value: true
      - actions:
# FIXME: bring below back once "adb reboot bootloader" doesn't hang on UT side
#          - adb:reboot:
#              to_state: "bootloader"
#        fallback:
          - core:user_action:
              action: "bootloader"
        condition:
          OR:
            - var: "bootstrap"
              value: true
            - var: "wipe"
              value: true
      - actions:
          - fastboot:set_active:
              slot: "a"
          - fastboot:flash:
              partitions:
                - partition: "boot_a"
                  file: "unpacked/boot.img"
                  group: "firmware"
                - partition: "dtbo_a"
                  file: "unpacked/dtbo.img"
                  group: "firmware"
                - partition: "gz_a"
                  file: "unpacked/gz.img"
                  group: "firmware"
                - partition: "lk_a"
                  file: "unpacked/lk.img"
                  group: "firmware"
                - partition: "logo"
                  file: "unpacked/logo.img"
                  group: "firmware"
                - partition: "md1img_a"
                  file: "unpacked/md1img.img"
                  group: "firmware"
                - partition: "preloader_a"
                  file: "unpacked/preloader.img"
                  group: "firmware"
                - partition: "scp_a"
                  file: "unpacked/scp.img"
                  group: "firmware"
                - partition: "spmfw_a"
                  file: "unpacked/spmfw.img"
                  group: "firmware"
                - partition: "sspm_a"
                  file: "unpacked/sspm.img"
                  group: "firmware"
                - partition: "super"
                  file: "unpacked/super.img"
                  group: "firmware"
                - partition: "tee_a"
                  file: "unpacked/tee.img"
                  group: "firmware"
                - partition: "vbmeta_a"
                  file: "unpacked/vbmeta.img"
                  group: "firmware"
                  flags: ["--disable-verity"]
        condition:
          var: "bootstrap"
          value: true

      # Optionally wipe userdata
      - actions:
          - fastboot:format:
              partition: "userdata"
        condition:
          var: "wipe"
          value: true

      # Reboot to UBports recovery to install UT
      - actions:
          - fastboot:reboot_recovery:
        fallback:
          - core:user_action:
              action: "recovery"
        condition:
          OR:
            - var: "bootstrap"
              value: true
            - var: "wipe"
              value: true
      - actions:
# FIXME: bring below back once "adb reboot recovery" doesn't hang on UT side
#          - adb:reboot:
#              to_state: "recovery"
#        fallback:
          - core:user_action:
              action: "recovery"
        condition:
          var: "bootstrap"
          value: false
      - actions:
          - systemimage:install:
      - actions:
          - adb:reboot:
              to_state: "recovery"
        fallback:
          - core:user_action:
              action: "recovery"
    slideshow: []

  - name: "Volla OS"
    compatible_installer: ">=0.9.2-beta"
    prerequisites: []
    steps:
      - actions:
          - core:download:
              group: "firmware"
              files:
                - url: "https://volla.tech/filedump/vollaos/volla-14.0-20250510-stable-BOOTSTRAP-mimameid.zip"
                  checksum:
                    sum: "4ca5445f76767a13a21ba823deb02b8936fd77ef20e78e5f66dee328130ec3b9"
                    algorithm: "sha256"
          - core:unpack:
              group: "firmware"
              files:
                - archive: "volla-14.0-20250510-stable-BOOTSTRAP-mimameid.zip"
                  dir: "unpacked"
      - actions:
# FIXME: bring below back once "adb reboot bootloader" doesn't hang on UT side
#          - adb:reboot:
#              to_state: "bootloader"
#        fallback:
          - core:user_action:
              action: "bootloader"
      - actions:
